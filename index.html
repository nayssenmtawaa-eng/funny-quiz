cat << 'EOF' > index.html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funny Quiz</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d0b26;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .quiz-card {
            background: #18153d;
            border: 2px solid #5d46e2;
            border-radius: 16px;
            padding: 25px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(93, 70, 226, 0.3);
            text-align: center;
        }
        h1 {
            color: #a78bfa;
            margin-bottom: 20px;
        }
        .btn {
            background: #6d28d9;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
            width: 100%;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #5b21b6;
        }
        .option-btn {
            background: #2e2a5a;
            color: white;
            border: 1px solid #5d46e2;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            text-align: right;
        }
        .option-btn:hover {
            background: #4c1d95;
        }
    </style>
</head>
<body>

<div class="quiz-card" id="quiz">
    <h1>اختبار Funny Quiz 🎭</h1>
    <div id="question-container">
        <p id="question-text" style="font-size: 18px;"></p>
        <div id="options-container"></div>
    </div>
    <div id="result-container" style="display: none;">
        <h2>وفا الكويز! 🎉</h2>
        <p id="score-text" style="font-size: 20px; color: #a78bfa;"></p>
        <p>تم إرسال إجاباتك بنجاح!</p>
    </div>
</div>

<script>
    const questions = [
        {
            question: "سؤال 1: شكون أكتر واحد يضحك في العيلة؟",
            options: ["أنا", "بابا", "أختي", "صاحبي"],
            correct: 0
        },
        {
            question: "سؤال 2: أشنوة أكثر لعبة تلعبها؟",
            options: ["Free Fire", "PES", "PUBG", "أخرى"],
            correct: 0
        }
    ];

    let currentQuestion = 0;
    let score = 0;
    let userAnswers = [];

    function loadQuiz() {
        if (currentQuestion < questions.length) {
            const q = questions[currentQuestion];
            document.getElementById('question-text').innerText = q.question;
            const optionsDiv = document.getElementById('options-container');
            optionsDiv.innerHTML = '';

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectOption(index, opt);
                optionsDiv.appendChild(btn);
            });
        } else {
            finishQuiz();
        }
    }

    function selectOption(index, answerText) {
        userAnswers.push({
            question: questions[currentQuestion].question,
            answer: answerText
        });

        if (index === questions[currentQuestion].correct) {
            score++;
        }

        currentQuestion++;
        loadQuiz();
    }

    function finishQuiz() {
        document.getElementById('question-container').style.display = 'none';
        document.getElementById('result-container').style.display = 'block';
        document.getElementById('score-text').innerText = `النتيجة متاعك: ${score} / ${questions.length}`;

        sendAnswersToEmail(userAnswers, score);
    }

    function sendAnswersToEmail(answers, finalScore) {
        fetch('https://formspree.io/f/mrpbndln', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                score: `${finalScore} / ${questions.length}`,
                answers: answers,
                date: new Date().toLocaleString()
            })
        })
        .then(response => {
            if (response.ok) {
                console.log('تم إرسال الإجابات بنجاح!');
            }
        })
        .catch(error => console.error('خطأ في الإرسال:', error));
    }

    loadQuiz();
</script>

</body>
</html>
EOF
